# Alembic configuration (TZ 3.1: SQLAlchemy 2.0 + Alembic).
#
# The connection URL is deliberately NOT stored here: TZ 9 forbids secrets in the
# repository. `alembic/env.py` resolves it from `Config.attributes["database_url"]`,
# then from the DATABASE_URL environment variable, then from `.env` via src.config.

[alembic]
script_location = %(here)s/alembic

# Revisions are numbered by hand: 0001_initial, 0002_..., so the order is readable
# in a directory listing and in review.
file_template = %%(rev)s_%%(slug)s

# `src` must be importable: env.py imports the model layer for autogenerate.
prepend_sys_path = .

path_separator = os

# Intentionally empty — see the note at the top of this file.
sqlalchemy.url =


[post_write_hooks]
hooks = ruff_format,ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
