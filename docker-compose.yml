# Local and staging stand for BarPoint Staff Bot.
#
#   docker compose up -d          bring everything up; migrations run on their own
#   docker compose logs -f bot    bot log
#   docker compose restart scheduler   acceptance criterion 11.4 needs this to be a
#                                      separate process, hence a separate service
#
# Every value comes from the environment (TZ 9); `.env` next to this file is picked up
# automatically and never lands in the repository.
#
# docker-compose.override.yml sits next to this file and is merged in automatically. It
# holds everything that only makes sense on a developer machine -- today that is the
# published database and cache ports. A deployment starts with an explicit
# `docker compose -f docker-compose.yml up -d` and never sees the override.

name: barpoint

# --------------------------------------------------------------------------------------
# Shared pieces
# --------------------------------------------------------------------------------------

# Postgres credentials, defined here and nowhere else. The `postgres` service and the
# application processes both read these very nodes through YAML aliases, so the password
# cannot drift between the server and the connection string.
#
# The `barpoint` fallbacks exist for the LOCAL STAND ONLY, so that `docker compose up`
# works on a fresh clone without an `.env`. In every deployed environment all three are
# supplied by the environment (TZ 9) -- either as POSTGRES_* or as a ready-made
# DATABASE_URL, which the entry point prefers over anything it could assemble itself.
#
# This is not left to discipline: with APP_ENV=prod and the password still equal to the
# fallback below, docker/entrypoint.sh refuses to start and says why (tests/test_entrypoint.py).
# A convenience of the local stand must not be able to survive into production silently.
x-postgres-user: &postgres-user ${POSTGRES_USER:-barpoint}
x-postgres-password: &postgres-password ${POSTGRES_PASSWORD:-barpoint}
x-postgres-db: &postgres-db ${POSTGRES_DB:-barpoint}

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  BOT_TOKEN: ${BOT_TOKEN:-}
  OWNER_TELEGRAM_IDS: ${OWNER_TELEGRAM_IDS:-}
  # DATABASE_URL is deliberately absent: docker/entrypoint.sh assembles it from the
  # POSTGRES_* parts below unless one is passed in explicitly. That keeps the credentials
  # in a single place -- spelling the DSN out here would repeat the password literal.
  # Service names, not localhost: inside the compose network the database is `postgres`.
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: *postgres-user
  POSTGRES_PASSWORD: *postgres-password
  POSTGRES_DB: *postgres-db
  REDIS_URL: redis://redis:6379/0
  TZ: UTC

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: barpoint-staff-bot:local
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

# --------------------------------------------------------------------------------------
# Services
# --------------------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: *postgres-user
      POSTGRES_PASSWORD: *postgres-password
      POSTGRES_DB: *postgres-db
      # TZ 3.4: the database stores UTC, so the server must not localise anything itself.
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Nothing may connect before the server accepts queries: the migration job would
      # otherwise fail on the very first `docker compose up`.
      #
      # `$$` keeps compose from substituting: the variables are expanded by the shell
      # inside the container, where they hold the values of the `environment` block above.
      # Spelling the interpolation with its fallback out again here would be a second
      # definition of the same default, and defaults that live in two places drift apart.
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # FSM state must survive a bot restart (plan, task 20), so Redis persists.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot schema job. Exists so that exactly one process runs `upgrade head`; bot and
  # scheduler wait for it to finish successfully and then start with RUN_MIGRATIONS=0.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: barpoint-staff-bot:local
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
    # The entry point migrates first; this only prints the revision the schema ended up on.
    command: ["alembic", "current"]
    restart: "no"

  bot:
    <<: *app
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "0"
    command: ["python", "-m", "src.bot"]
    # Both this service and `scheduler` are long-running now (plan tasks 20 and 31), so a
    # process that stops has failed and has to come back: a bartender opening a shift at
    # eight in the morning has nobody to restart it. While they were the stubs of task 1 --
    # one log line and exit 0 -- this was deliberately `no`, because `unless-stopped` over a
    # process that exits successfully is an endless restart loop that reads as a healthy
    # stand in `docker compose ps`.
    restart: unless-stopped

  # Separate process on purpose (plan, task 6): criterion 11.4 requires restarting the
  # scheduler on its own and checking that no notification is lost or duplicated.
  scheduler:
    <<: *app
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "0"
    command: ["python", "-m", "src.scheduler"]
    # See the comment on `bot`. The worker matters more than the bot here: the bot's silence
    # is noticed by the person pressing a button, and the worker's silence is noticed by
    # nobody -- the checklist simply does not arrive (principle 1.4#2).
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
